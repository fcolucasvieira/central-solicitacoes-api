server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration-ms: ${EXPIRATION_MS:86400000}
      issuer: ${JWT_ISSUER:central-solicitacoes-api}
