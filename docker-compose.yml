services:
  postgres:
    container_name: solicitacoes_postgres
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - solicitacoes_data:/var/lib/postgresql/data

volumes:
  solicitacoes_data:
